<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <title>Rafflink: giveaways for Twitch streamers</title>
    <meta
      name="description"
      content="Create a giveaway, share one link and draw winners live. Viewers sign in with Twitch and are entered in seconds."
    />
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rafflink" />
    <meta property="og:title" content="Rafflink: giveaways for Twitch streamers" />
    <meta
      property="og:description"
      content="Create a giveaway, share one link and draw winners live. Viewers sign in with Twitch and are entered in seconds."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rafflink: giveaways for Twitch streamers" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rafflink: giveaways for Twitch streamers" />
    <meta
      name="twitter:description"
      content="Create a giveaway, share one link and draw winners live. Viewers sign in with Twitch and are entered in seconds."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./public/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <link rel="manifest" href="./public/site.webmanifest" />
    <script>
      // Sets the theme before first paint so a dark page never flashes light. Mirrors src/theme/theme.ts.
      try {
        var choice = localStorage.getItem("rafflink-theme")
        var dark =
          choice === "dark"
          || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      } catch (error) {
        console.warn("theme not applied before first paint", error)
      }
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
