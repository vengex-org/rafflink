<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Rafflink</title>
    <script>
      // Sets the theme before first paint so a dark page never flashes light. Mirrors src/theme/theme.ts.
      try {
        var choice = localStorage.getItem("rafflink-theme")
        var dark =
          choice === "dark"
          || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      } catch (error) {
        console.warn("theme not applied before first paint", error)
      }
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
