name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pushes and pull requests from this repository run on the owner's self-hosted runner. Pull requests from
    # forks stay on a GitHub runner, so code from outside never runs on that machine.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","gaming-pc"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Pick the checks for the changed files
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A push to master always runs everything; a pull request runs what its changed files need.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then echo "scope=full" >> "$GITHUB_OUTPUT"; exit 0; fi
          scope=docs
          for file in $(git diff --name-only "$BASE"...HEAD); do
            case "$file" in
              *.md | docs/*) ;;
              apps/web/src/i18n/*) [ "$scope" = docs ] && scope=text ;;
              *) scope=full ;;
            esac
          done
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Check scope: $scope"
      # docs: Markdown only. text: also translation strings, whose keys are typed. full: everything.
      - run: bun run format:check
      - run: bun run lint
        if: steps.scope.outputs.scope != 'docs'
      - run: bun run typecheck
        if: steps.scope.outputs.scope != 'docs'
      - run: bun run test
        if: steps.scope.outputs.scope == 'full'
      - run: bun run build
        if: steps.scope.outputs.scope == 'full'
      # The source maps of a master build go to Sentry under the commit as the release; a deploy built from the same
      # commit with SENTRY_RELEASE set to it resolves against them. Skipped without the secret (forks, self-hosters).
      - name: Upload source maps to Sentry
        if: github.event_name == 'push'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: vengex-ww
          SENTRY_URL: https://de.sentry.io
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN, source maps not uploaded"; exit 0; fi
          bunx @sentry/cli@3.8.2 sourcemaps upload --project rafflink-web --release "$GITHUB_SHA" apps/web/dist
          bunx @sentry/cli@3.8.2 sourcemaps upload --project rafflink-worker --release "$GITHUB_SHA" apps/cloudflare/dist
